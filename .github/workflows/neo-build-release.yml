name: 汉化版构建与发布

# 本工作流为 fork 专属：
# 1) 构建 Android APK（Kenjinx，mainlineArmv82Release）
# 2) 构建桌面 Linux x64 版（Ryujinx）
# 3) 将构建产物上传到本仓库的 Release（tag: nightly）
#
# 触发方式：
#   - 推送到默认分支 neo-v2-nce2
#   - 手动运行（Actions 页面 -> Run workflow）

on:
  workflow_dispatch:
  push:
    branches: [ neo-v2-nce2 ]

concurrency:
  group: neo-build-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_PLATFORM: 'android-37.0'
  ANDROID_BUILD_TOOLS: '37.0.0'
  NDK_VERSION: '28.2.13676358'
  CMAKE_SDK_VERSION: '3.22.1'
  CMAKE_NATIVE_VERSION: '4.1.2'
  CMDLINE_TOOLS_BUILD: '11076708'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m"'

jobs:
  android:
    name: Android APK (armv8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 .NET 9（9.0.x）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 安装 .NET Android 工作负载（编译 libkenjinx.so 需要）
        run: dotnet workload install android

      - name: 安装 Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$HOME"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_BUILD}_latest.zip" -O tools.zip
          unzip -q tools.zip -d cmdline-tools-temp
          mv cmdline-tools-temp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_SDK_VERSION}"

          cd /tmp
          wget -q "https://github.com/Kitware/CMake/releases/download/v${CMAKE_NATIVE_VERSION}/cmake-${CMAKE_NATIVE_VERSION}-linux-x86_64.tar.gz" -O cmake.tar.gz
          tar -xzf cmake.tar.gz
          CMAKE_INSTALL_DIR="$ANDROID_HOME/cmake/${CMAKE_NATIVE_VERSION}"
          mkdir -p "$CMAKE_INSTALL_DIR"
          cp -r "cmake-${CMAKE_NATIVE_VERSION}-linux-x86_64/." "$CMAKE_INSTALL_DIR/"

      - name: 配置环境（android-37 兼容符号链接）
        run: |
          export ANDROID_HOME=$HOME/android-sdk

          # SDK 37 的 platform 目录名为 android-37.0，链接为 android-37 供 Gradle 解析
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmake/${CMAKE_NATIVE_VERSION}/bin" >> "$GITHUB_PATH"

          NDK_PATH="$ANDROID_HOME/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: 配置 NuGet 源
        run: |
          # git.ryujinx.app 私有源已失效（2026-10 起持续超时），只用 nuget.org
          find . -iname "nuget.config" -delete
          cat > nuget.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet nuget locals all --clear

      - name: 生成 debug keystore
        run: |
          mkdir -p /home/runner/.config/.android
          keytool -genkey -v \
            -keystore /home/runner/.config/.android/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 构建 APK（mainlineArmv82Release）
        working-directory: src/KenjinxAndroid
        run: |
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK_HOME
          cmake.dir=$ANDROID_HOME/cmake/${CMAKE_NATIVE_VERSION}
          EOF
          # git.ryujinx.app 已死：openal-soft submodule 无法从原 URL 拉取，
          # 用官方上游源码替代（CMake 会自行拉取 adrenotools 及其嵌套 submodule）
          if [ ! -d app/src/main/cpp/libraries/openal/CMakeLists.txt ]; then
            rm -rf app/src/main/cpp/libraries/openal
            git clone --depth 1 https://github.com/kcat/openal-soft.git app/src/main/cpp/libraries/openal
          fi
          ./gradlew assembleMainlineArmv82Release \
            -Porg.kenjinx.config=release \
            -Pandroid.ndkPath="$ANDROID_NDK_HOME" \
            --no-daemon \
            --build-cache \
            --parallel

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: kenjinx-apk
          path: src/KenjinxAndroid/app/build/outputs/apk/mainlineArmv82/release/*.apk
          if-no-files-found: error

  desktop:
    name: 桌面 Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 设置 .NET 9（9.0.x）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 配置 NuGet 源
        run: |
          # git.ryujinx.app 私有源已失效（2026-10 起持续超时），只用 nuget.org
          find . -iname "nuget.config" -delete
          cat > nuget.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet nuget locals all --clear

      - name: 发布 Ryujinx（Linux x64 自包含）
        run: |
          mkdir -p release_output
          dotnet publish -c Release -r linux-x64 -o ./publish/publish \
            -p:DebugType=embedded src/Ryujinx --self-contained true
          chmod +x publish/publish/Ryujinx.sh publish/publish/Ryujinx
          tar -czvf release_output/ryujinx-neo-linux-x64.tar.gz -C publish publish

      - name: 上传桌面产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: release_output/*.tar.gz
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: "上传到 Release（tag: nightly）"
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: 最新汉化版 (Nightly)
          body: |
            自动构建的汉化版本（Ryujinx_Neo fork）。
            - Android APK：Kenjinx（界面已全面汉化，默认简体中文）
            - 桌面版：Ryujinx Linux x64（界面已全面汉化，默认简体中文）
          artifacts: "artifacts/**/*.apk,artifacts/**/*.tar.gz"
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
